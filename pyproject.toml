[project]
name = "yolo-pipeline-cuvettes"
version = "0.1.0"
description = "Pipeline YOLO segmentation pour détection de cuvettes de dégazage"
requires-python = ">=3.10"

dependencies = [
    "ultralytics>=8.2.0",
    "opencv-python>=4.10.0",
    "numpy>=2.0",
    "sahi>=0.12.0",
    "pillow>=10.1.0",
    "python-dotenv>=1.0.0",
    "psutil>=6.0.0",
    "torch>=2.1.0; python_version < '3.13'",
    "torchvision>=0.16.0; python_version < '3.13'",
]

[tool.uv]
find-links = ["https://download.pytorch.org/whl/cpu"]

